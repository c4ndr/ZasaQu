server {
    listen 80;
    server_name zasaqu.uk localhost;
    root /home/candra/zashaGo/frontend/dist;
    index index.html;

    # Charset & gzip
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # APK — disimpan di releases/ yang terpisah dari web root, tidak terpengaruh web deploy
    location = /zasaqu.apk {
        alias /home/candra/zashaGo/releases/zasaqu.apk;
        add_header Content-Disposition 'attachment; filename="ZasaQu.apk"';
        add_header Cache-Control 'no-cache';
    }

    # Static assets — cache 30 hari
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker & manifest — no cache
    location ~* \.(js|json)$ {
        if ($uri ~* "sw-(admin|mitra)\.js|firebase-messaging-sw\.js|manifest\.json") {
            add_header Cache-Control "no-cache";
        }
        try_files $uri $uri/ /index.html;
    }

    # Laravel API — proxy ke artisan serve (port 8000)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # Laravel storage (foto, upload)
    location /storage/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Sanctum CSRF
    location /sanctum/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverb WebSocket
    location /app {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    # SPA — semua route ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
