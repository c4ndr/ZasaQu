[program:zasaqu-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /home/candra/zashaGo/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=60
directory=/home/candra/zashaGo/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=candra
numprocs=1
redirect_stderr=true
stdout_logfile=/home/candra/logs/zasaqu-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600

[program:zasaqu-reverb]
process_name=%(program_name)s
command=php /home/candra/zashaGo/backend/artisan reverb:start
directory=/home/candra/zashaGo/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=candra
numprocs=1
redirect_stderr=true
stdout_logfile=/home/candra/logs/zasaqu-reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:zasaqu-scheduler]
process_name=%(program_name)s
command=php /home/candra/zashaGo/backend/artisan schedule:work
directory=/home/candra/zashaGo/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=candra
numprocs=1
redirect_stderr=true
stdout_logfile=/home/candra/logs/zasaqu-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:zasaqu-tunnel]
process_name=%(program_name)s
command=/home/candra/.local/bin/cloudflared tunnel --config /home/candra/.cloudflared/config.yml run zasaqu
directory=/home/candra
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=candra
numprocs=1
redirect_stderr=true
stdout_logfile=/home/candra/logs/zasaqu-tunnel.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[group:zasaqu]
programs=zasaqu-queue,zasaqu-reverb,zasaqu-scheduler,zasaqu-tunnel
